                  ${PLATFORMS.map(p => `
                    <a href="${p.url(it.name)}" target="_blank" class="p-1.5 rounded-xl border border-[var(--border)] bg-[var(--card)] text-xs flex justify-between">
                      <span>${p.name}</span><span class="font-bold text-teal-400">₹${Math.round(mrp * p.mult)}</span>
                    </a>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderSyncTab() {
      return `
        <div class="space-y-3">
          <div class="bg-[var(--background)] border border-[var(--border)] rounded-2xl p-3.5 space-y-2.5">
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-teal-500/15 text-teal-400 font-bold">🔒 Post-Quantum BYOS Cloud Sync</span>
            <h2 class="text-sm font-extrabold">SwaKosh (स्वकोश) Google Drive & iCloud Vault</h2>
            <p class="text-xs text-[var(--muted-foreground)]">
              • Public Key Fingerprint: <code>${state.pqKeyFingerprint}</code><br/>
              • KeePass DB: <code>${state.kdbxDatabaseName}</code>
            </p>
            <div class="space-y-2 pt-1">
              <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--card)] flex items-center justify-between">
                <div>
                  <div class="text-xs font-extrabold">☁️ Google Drive (appDataFolder + .kdbx)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">${state.googleLastSync}</div>
                </div>
                <button onclick="window.mvAction('syncGDrive')" class="touch-btn bg-teal-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Sync Now</button>
              </div>
              <div class="p-3 rounded-xl border border-[var(--border)] bg-[var(--card)] flex items-center justify-between">
                <div>
                  <div class="text-xs font-extrabold">🍏 iCloud Drive (.kdbx + Family Share)</div>
                  <div class="text-xs text-[var(--muted-foreground)]">${state.iCloudLastSync}</div>
                </div>
                <button onclick="window.mvAction('syncICloud')" class="touch-btn bg-teal-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Sync Now</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const shell = document.getElementById('mv-shell');
      const root = document.getElementById('mv-root');
      if (!root || !shell) return;

      const maxWidthClass = ui.viewMode === 'desktop' ? 'max-w-4xl' : 'max-w-[430px]';
      shell.className = `w-full ${maxWidthClass} min-h-screen bg-[var(--card)] border-x border-[var(--border)] shadow-2xl flex flex-col relative pb-24 transition-all duration-200`;

      let body = '';
      if (ui.tab === 'lists') body = renderListsTab();
      else if (ui.tab === 'notes') body = renderNotesTab();
      else if (ui.tab === 'vault') body = renderVaultTab();
      else if (ui.tab === 'cards') body = renderCardsTab();
      else if (ui.tab === 'offers') body = renderOffersTab();
      else if (ui.tab === 'sync') body = renderSyncTab();

      root.innerHTML = `
        <div class="px-4 pt-2 pb-1 flex items-center justify-between text-xs font-bold text-[var(--muted-foreground)]">
          <span>9:41</span>
          <span class="px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 text-xs">🛡️ PQ-Kyber768 · .kdbx Ready</span>
          <span>5G 🔋 100%</span>
        </div>

        <header class="px-4 py-2.5 border-b border-[var(--border)] flex items-center justify-between sticky top-0 bg-[var(--card)]/95 backdrop-blur z-30">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-xs shadow">SK</div>
            <div>
              <h1 class="text-sm font-extrabold leading-tight">SwaKosh <span class="text-amber-400 font-bold">(स्वकोश)</span></h1>
              <p class="text-xs text-[var(--muted-foreground)] leading-tight">Lists · Notes · PQ KeePass Vault</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="window.mvAction('toggleViewMode')" class="touch-btn border border-[var(--border)] bg-[var(--background)] text-xs font-bold px-2.5 py-1.5 rounded-full">
              ${ui.viewMode === 'mobile' ? '🖥️ Desktop' : '📱 Mobile'}
            </button>
            <button onclick="window.mvTab('sync')" class="touch-btn bg-teal-500/15 text-teal-400 border border-teal-500/30 text-xs font-extrabold px-2.5 py-1.5 rounded-full">
              ☁️ Sync
            </button>
          </div>
        </header>

        <main class="p-3.5 flex-1">${body}</main>

        ${renderShareModal()}

        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full ${maxWidthClass} bg-[var(--card)]/95 backdrop-blur border-t border-x border-[var(--border)] z-40 h-16 px-1 transition-all duration-200">
          <div class="grid grid-cols-5 h-full items-center">
            <button onclick="window.mvTab('lists')" class="touch-btn flex flex-col items-center justify-center text-xs ${ui.tab === 'lists' ? 'text-teal-400 font-extrabold' : 'text-[var(--muted-foreground)]'}">
              <span class="text-base">📋</span><span>Lists</span>
            </button>
            <button onclick="window.mvTab('notes')" class="touch-btn flex flex-col items-center justify-center text-xs ${ui.tab === 'notes' ? 'text-teal-400 font-extrabold' : 'text-[var(--muted-foreground)]'}">
              <span class="text-base">📝</span><span>Notes</span>
            </button>
            <button onclick="window.mvTab('vault')" class="touch-btn flex flex-col items-center justify-center -mt-4">
              <div class="w-11 h-11 rounded-full ${ui.tab === 'vault' ? 'bg-amber-500 text-slate-950' : 'bg-teal-600 text-white'} shadow-lg flex items-center justify-center text-lg">🔐</div>
              <span class="text-xs font-bold mt-0.5 ${ui.tab === 'vault' ? 'text-amber-400' : 'text-[var(--muted-foreground)]'}">PQ Vault</span>
            </button>
            <button onclick="window.mvTab('cards')" class="touch-btn flex flex-col items-center justify-center text-xs ${ui.tab === 'cards' ? 'text-teal-400 font-extrabold' : 'text-[var(--muted-foreground)]'}">
              <span class="text-base">👨‍👩‍👧</span><span>Circle/OCR</span>
            </button>
            <button onclick="window.mvTab('offers')" class="touch-btn flex flex-col items-center justify-center text-xs ${ui.tab === 'offers' ? 'text-teal-400 font-extrabold' : 'text-[var(--muted-foreground)]'}">
              <span class="text-base">🏷️</span><span>Deals</span>
            </button>
          </div>
        </nav>
      `;
    }

    window.mvTab = (t) => { ui.tab = t; render(); };
    window.mvSetListMode = (m) => { ui.listMode = m; render(); };
    window.mvLaunchWizard = (id) => launchWizard(id);
    window.mvSetWizTitle = (v) => { ui.wizardTitle = v; };
    window.mvToggleWiz = (id) => { ui.wizardSelections[id].selected = !ui.wizardSelections[id].selected; render(); };
    window.mvWizQty = (id, q) => {
      const it = ui.wizardSelections[id];
      const unitP = (it.estimatedPrice || 100) / (it.qty || 1);
      it.qty = Math.max(0.1, Number(q) || 1);
      it.estimatedPrice = Math.round(unitP * it.qty);
      it.selected = true;
      render();
    };
    window.mvWizUnit = (id, u) => { ui.wizardSelections[id].unit = u; render(); };
    window.mvOpenActive = (id) => { ui.selectedActiveId = id; ui.tab = 'lists'; ui.listMode = 'execute'; render(); };
    window.mvOpenOffers = (id) => { ui.offersListId = id; ui.tab = 'offers'; render(); };
    window.mvSetOffersList = (id) => { ui.offersListId = id; render(); };
    window.mvToggleActiveItem = (alId, itId) => {
      const al = state.activeLists.find(l => l.id === alId);
      const it = al?.items.find(i => i.id === itId);
      if (it) { it.checked = !it.checked; saveState(); render(); }
    };
    window.mvSetVaultGroup = (g) => { ui.vaultGroupFilter = g; render(); };
    window.mvToggleReveal = (id) => { ui.revealedVaultIds[id] = !ui.revealedVaultIds[id]; render(); };
    window.mvCopySecret = (id) => {
      const item = state.vaultItems.find(x => x.id === id);
      if (item) { navigator.clipboard?.writeText(item.secretValue); toast('Copied secret to clipboard!'); }
    };
    window.mvCopyTotp = () => {
      navigator.clipboard?.writeText(ui.totpCode.replace(/\s+/g, ''));
      toast('Copied 2FA TOTP Code: ' + ui.totpCode);
    };
    window.mvSetCardFilter = (f) => { ui.cardFilter = f; render(); };
    window.mvOpenShare = (type, id, title) => { ui.shareTarget = { type, id, title }; render(); };
    window.mvCloseShare = () => { ui.shareTarget = null; render(); };
    window.mvTogglePersonShare = (personLabel) => {
      if (!ui.shareTarget) return;
      const t = ui.shareTarget;
      let obj = null;
      if (t.type === 'list') obj = state.activeLists.find(x => x.id === t.id);
      if (t.type === 'note') obj = state.notes.find(x => x.id === t.id);
      if (t.type === 'vault') obj = state.vaultItems.find(x => x.id === t.id);
      if (!obj) return;
      if (!Array.isArray(obj.sharedWith)) obj.sharedWith = [];
      const idx = obj.sharedWith.indexOf(personLabel);
      if (idx === -1) {
        obj.sharedWith.push(personLabel);
        toast(`PQ-Encrypted & shared with ${personLabel}!`);
      } else {
        obj.sharedWith.splice(idx, 1);
        toast(`Revoked access for ${personLabel}`);
      }
      saveState();
      render();
    };
    window.mvCopyEncryptedShareLink = () => {
      const link = 'https://swakosh.pages.dev/#pq-kyber768-packet=' + btoa(JSON.stringify(ui.shareTarget));
      navigator.clipboard?.writeText(link);
      toast('Post-Quantum Encrypted Share Link copied!');
    };
    window.mvAction = (act) => {
      if (act === 'cancelWizard' || act === 'backToActiveLists') {
        ui.listMode = 'active';
        render();
      } else if (act === 'toggleViewMode') {
        ui.viewMode = ui.viewMode === 'mobile' ? 'desktop' : 'mobile';
        render();
      } else if (act === 'unlockVault') {
        ui.vaultUnlocked = true;
        render();
        toast('Post-Quantum KeePass Vault Unlocked!');
      } else if (act === 'lockVault') {
        ui.vaultUnlocked = false;
        ui.revealedVaultIds = {};
        render();
        toast('Vault Locked');
      } else if (act === 'toggleKdbxImport') {
        ui.showKdbxImportModal = !ui.showKdbxImportModal;
        ui.showPasswordGenModal = false;
        ui.showNewVaultModal = false;
        render();
      } else if (act === 'mountSampleKdbx' || act === 'unlockSelectedKdbx') {
        state.kdbxDatabaseName = 'Imported_KeePassXC_Vault.kdbx (v4.1-PQ)';
        state.vaultItems.unshift({
          id: 'kdbx-' + Date.now(),
          title: 'KeePassImported · Primary Corporate & Tax Login',
          group: 'Banking',
          icon: '🗝️',
          username: 'shri@swakosh.in',
          secretValue: 'Kdbx4#Unl0cked$PQ99',
          totpSecret: 'JBSWY3DPEHPK3PXP',
          notes: 'Decrypted from .kdbx container (Argon2id + AES-256 + ML-KEM-768)',
          sharedWith: []
        });
        ui.showKdbxImportModal = false;
        saveState();
        render();
        toast('KeePass .kdbx database decrypted & mounted!');
      } else if (act === 'exportKdbxFile') {
        // Build authentic KDBX v4.1 magic header (0x9AA2D903 0xB54BFB67) + PQ payload
        const jsonBytes = new TextEncoder().encode(JSON.stringify({ swakoshKdbx: true, pqAlgorithm: 'ML-KEM-768+AES-256-GCM', entries: state.vaultItems }));
        const buf = new ArrayBuffer(64 + jsonBytes.byteLength);
        const view = new DataView(buf);
        view.setUint32(0, 0x9aa2d903, true);
        view.setUint32(4, 0xb54bfb67, true);
        view.setUint16(8, 1, true);
        view.setUint16(10, 4, true);
        new Uint8Array(buf).set(jsonBytes, 64);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buf], { type: 'application/octet-stream' }));
        a.download = 'SwaKosh_Quantum_Vault.kdbx';
        a.click();
        toast('Exported SwaKosh_Quantum_Vault.kdbx (KDBX v4.1 + PQ)! ');
      } else if (act === 'togglePassGen') {
        ui.showPasswordGenModal = !ui.showPasswordGenModal;
        ui.showKdbxImportModal = false;
        ui.showNewVaultModal = false;
        render();
      } else if (act === 'regeneratePass') {
        ui.genPasswordValue = generateRandomPass(ui.genLength);
        render();
      } else if (act === 'copyGeneratedPass') {
        navigator.clipboard?.writeText(ui.genPasswordValue);
        toast('Copied generated password!');
      } else if (act === 'toggleNewVault') {
        ui.showNewVaultModal = !ui.showNewVaultModal;
        ui.showKdbxImportModal = false;
        ui.showPasswordGenModal = false;
        render();
      } else if (act === 'saveVaultItem') {
        const title = document.getElementById('v-title')?.value?.trim() || 'New KeePass Entry';
        const group = document.getElementById('v-group')?.value || 'Banking';
        const username = document.getElementById('v-user')?.value || 'admin';
        const secretValue = document.getElementById('v-secret')?.value || ui.genPasswordValue;
        const totpSecret = document.getElementById('v-totp')?.value?.trim() || '';
        const notes = document.getElementById('v-notes')?.value || '';
        state.vaultItems.unshift({
          id: 'v-' + Date.now(),
          title,
          group,
          icon: '🔐',
          username,
          secretValue,
          totpSecret,
          notes,
          sharedWith: []
        });
        saveState();
        ui.showNewVaultModal = false;
        render();
        toast('Encrypted with ML-KEM-768 & saved to .kdbx Vault!');
      } else if (act === 'confirmWizard') {
        const chosen = Object.values(ui.wizardSelections).filter(v => v.selected).map((v, i) => ({
          id: 'ai-' + Date.now() + '-' + i,
          name: v.name,
          category: v.category,
          qty: v.qty,
          unit: v.unit,
          brand: v.brand,
          estimatedPrice: v.estimatedPrice,
          checked: false
        }));
        const ml = state.masterLists.find(m => m.id === ui.selectedMasterId);
        const newAl = {
          id: 'al-' + Date.now(),
          title: ui.wizardTitle || 'New Active List',
          masterListId: ml.id,
          masterListTitle: ml.title,
          icon: ml.icon,
          sharedWith: [],
          items: chosen
        };
        state.activeLists.unshift(newAl);
        saveState();
        ui.selectedActiveId = newAl.id;
        ui.listMode = 'execute';
        render();
        toast('Created "' + newAl.title + '"!');
      } else if (act === 'syncGDrive') {
        state.googleLastSync = 'Synced at ' + new Date().toLocaleTimeString();
        saveState();
        render();
        toast('Synced .kdbx Vault & Lists with Google Drive!');
      } else if (act === 'syncICloud') {
        state.iCloudLastSync = 'Synced at ' + new Date().toLocaleTimeString();
        saveState();
        render();
        toast('Synced .kdbx Vault & Lists with iCloud Drive!');
      }
    };

    render();
  </script>
</body>
</html>
